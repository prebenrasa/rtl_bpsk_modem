[project]
name = "rtl-bpsk-modem"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cocotb==2.1.0",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
# one worker per CPU, each takes one configuration at a time when it is free (configurations differ a lot
# in run time, so pre-assigned blocks leave a slow one queued behind another);
# pass -n 0 to run them one after another, e.g. with -s to see the simulation log
addopts = "-n auto --dist load --maxschedchunk 1"
