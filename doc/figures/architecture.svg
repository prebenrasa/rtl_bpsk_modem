<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>bpsk_modem architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/>
    </marker>
    <style>
      .data { fill: #eef4fc; stroke: #2a78d6; stroke-width: 1.5; }
      .loop { fill: #fdf0ea; stroke: #eb6834; stroke-width: 1.5; }
      .group { fill: none; stroke: #8a8984; stroke-width: 1; }
      .chan { fill: #f6f6f4; stroke: #8a8984; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .wire { fill: none; stroke: #52514e; stroke-width: 1.5; marker-end: url(#arrow); }
      .loopwire { fill: none; stroke: #eb6834; stroke-width: 1.5; marker-end: url(#arrow-loop); }
      .t { fill: #0b0b0b; text-anchor: middle; }
      .s { fill: #52514e; font-size: 11px; text-anchor: middle; }
      .lbl { fill: #52514e; font-size: 11px; }
      .grp { fill: #0b0b0b; font-size: 13px; font-weight: bold; }
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>

  <!-- bpsk_tx: left to right -->
  <rect class="group" x="20" y="20" width="960" height="180" rx="6"/>
  <text class="grp" x="32" y="40">bpsk_tx</text>
  <text class="lbl" x="32" y="94">bit_data</text>
  <text class="lbl" x="32" y="108">valid / ready</text>
  <path class="wire" d="M110,98 H150"/>
  <rect class="data" x="150" y="73" width="170" height="50" rx="4"/>
  <text class="t" x="235" y="94">Differential encoder</text>
  <text class="s" x="235" y="111">d(n) = b(n) xor d(n−1)</text>
  <path class="wire" d="M320,98 H420"/>
  <text class="lbl" x="345" y="90">symbol</text>
  <rect class="data" x="420" y="73" width="160" height="50" rx="4"/>
  <text class="t" x="500" y="94">BPSK mapper</text>
  <text class="s" x="500" y="111">± carrier</text>
  <rect class="data" x="420" y="140" width="160" height="48" rx="4"/>
  <text class="t" x="500" y="160">NCO</text>
  <text class="s" x="500" y="177">N-bit phase · 2^M sine LUT</text>
  <path class="wire" d="M500,140 V123"/>
  <path class="wire" d="M580,98 H930 V226"/>
  <text class="lbl" x="700" y="90">tx_sample (L bits, GC_SPS per bit)</text>

  <!-- channel -->
  <rect class="chan" x="40" y="226" width="920" height="34" rx="4"/>
  <text class="t" x="480" y="248">Channel model (cocotb testbench): gain · AWGN · carrier phase offset and drift</text>

  <!-- bpsk_rx: right to left, from the channel -->
  <rect class="group" x="20" y="276" width="960" height="280" rx="6"/>
  <text class="grp" x="32" y="296">bpsk_rx</text>
  <path class="wire" d="M930,260 V365 H900"/>
  <text class="lbl" x="924" y="292" text-anchor="end">rx_sample</text>

  <rect class="data" x="790" y="300" width="110" height="130" rx="4"/>
  <text class="t" x="845" y="345">I/Q mixer</text>
  <text class="s" x="845" y="365">× sin → I</text>
  <text class="s" x="845" y="381">× cos → Q</text>

  <path class="wire" d="M790,325 H730"/>
  <path class="wire" d="M790,415 H730"/>
  <text class="lbl" x="756" y="318">I</text>
  <text class="lbl" x="756" y="408">Q</text>
  <rect class="data" x="560" y="300" width="170" height="130" rx="4"/>
  <text class="t" x="645" y="340">Moving sums</text>
  <text class="s" x="645" y="358">over GC_SPS samples</text>
  <text class="s" x="645" y="374">(matched filters)</text>
  <text class="s" x="645" y="390">LUTRAM ring buffers</text>

  <!-- I: decision and decoding -->
  <path class="wire" d="M560,325 H490"/>
  <text class="lbl" x="545" y="318">I</text>
  <circle cx="530" cy="325" r="3" fill="#52514e"/>
  <rect class="data" x="330" y="300" width="160" height="50" rx="4"/>
  <text class="t" x="410" y="321">Bit decision + trust</text>
  <text class="s" x="410" y="338">sign(I), |I| ≥ threshold</text>
  <path class="wire" d="M330,325 H290"/>
  <rect class="data" x="130" y="300" width="160" height="50" rx="4"/>
  <text class="t" x="210" y="321">Differential</text>
  <text class="t" x="210" y="337">decoder</text>
  <path class="wire" d="M130,325 H40"/>
  <text class="lbl" x="28" y="317">bit_data, bit_trust</text>

  <!-- I and Q into the Costas detector -->
  <path class="wire" d="M530,325 V395 H490"/>
  <path class="wire" d="M560,415 H490"/>
  <text class="lbl" x="545" y="408">Q</text>
  <rect class="loop" x="330" y="380" width="160" height="50" rx="4"/>
  <text class="t" x="410" y="401">Costas detector</text>
  <text class="s" x="410" y="418">e = sign(I) · Q</text>
  <path class="loopwire" d="M330,405 H290"/>
  <rect class="loop" x="130" y="380" width="160" height="50" rx="4"/>
  <text class="t" x="210" y="401">Loop filter</text>
  <text class="s" x="210" y="418">GC_KP, GC_KI → s_freq</text>

  <!-- feedback to the NCO -->
  <path class="loopwire" d="M210,430 V495 H790"/>
  <text class="lbl" x="400" y="488">NCO step (N + F bits), updated every sample</text>
  <rect class="loop" x="790" y="470" width="110" height="50" rx="4"/>
  <text class="t" x="845" y="491">NCO</text>
  <text class="s" x="845" y="508">sin, cos</text>
  <path class="loopwire" d="M845,470 V430"/>

  <!-- legend -->
  <rect class="data" x="40" y="527" width="14" height="12" rx="2"/>
  <text class="lbl" x="60" y="537">Datapath</text>
  <rect class="loop" x="130" y="527" width="14" height="12" rx="2"/>
  <text class="lbl" x="150" y="537">Carrier recovery loop</text>
</svg>
